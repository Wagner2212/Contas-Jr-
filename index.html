<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas Jr.</title>
  <script
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22[http://www.w3.org/2000/svg%22](http://www.w3.org/2000/svg%22) viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>"> src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .conta-item { border-left: 4px solid #334155; }
    .conta-paga { border-left-color: #10b981; }
    .conta-atrasada { border-left-color: #ef4444; }
    .conta-pendente { border-left-color: #f59e0b; }
  </style>
</head>
<body class="p-4 pb-20">

  <!-- Cabeçalho -->
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-emerald-500">Contas Jr.</h1>
  </header>

  <!-- Dashboard -->
  <section class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-slate-800 p-4 rounded-xl shadow-md">
      <p class="text-sm text-slate-400">Total do Mês</p>
      <p class="text-xl font-bold text-white" id="dash-total">R$ 0,00</p>
    </div>
    <div class="bg-slate-800 p-4 rounded-xl shadow-md">
      <p class="text-sm text-slate-400">Pendente</p>
      <p class="text-xl font-bold text-amber-500" id="dash-pendente">R$ 0,00</p>
    </div>
  </section>

  <!-- Lista de Contas -->
  <main>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold">Suas Contas</h2>
    </div>
    <div id="lista-contas" class="space-y-3">
      <!-- As contas aparecerão aqui -->
    </div>
  </main>

  <!-- Botão Flutuante -->
  <button onclick="abrirModal()" class="fixed bottom-6 right-6 bg-emerald-600 hover:bg-emerald-500 text-white w-14 h-14 rounded-full text-3xl shadow-lg flex items-center justify-center pb-1">
    +
  </button>

  <!-- Script do Motor do App -->
  <script>
    // Armazenamento Local
    let contas = JSON.parse(localStorage.getItem('contasJr_db')) || [];

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function atualizarDashboard() {
      const total = contas.reduce((acc, conta) => acc + Number(conta.valor), 0);
      const pendente = contas.filter(c => !c.paga).reduce((acc, conta) => acc + Number(conta.valor), 0);
      
      document.getElementById('dash-total').innerText = formatarMoeda(total);
      document.getElementById('dash-pendente').innerText = formatarMoeda(pendente);
    }

    function renderizarContas() {
      const lista = document.getElementById('lista-contas');
      lista.innerHTML = '';

      if (contas.length === 0) {
        lista.innerHTML = '<p class="text-slate-500 text-center mt-10">Nenhuma conta registada. Toque no + para começar.</p>';
      }

      contas.forEach((conta, index) => {
        const dataHoje = new Date().toISOString().split('T')[0];
        let statusClass = 'conta-pendente';
        let statusText = 'Pendente';
        let statusColor = 'text-amber-500';

        if (conta.paga) {
          statusClass = 'conta-paga';
          statusText = 'Paga';
          statusColor = 'text-emerald-500';
        } else if (conta.vencimento < dataHoje) {
          statusClass = 'conta-atrasada';
          statusText = 'Atrasada';
          statusColor = 'text-rose-500';
        }

        // Formatar data para exibição (DD/MM)
        const partesData = conta.vencimento.split('-');
        const dataExibicao = partesData.length === 3 ? `${partesData[2]}/${partesData[1]}` : conta.vencimento;

        lista.innerHTML += `
          <div class="bg-slate-800 p-4 rounded-xl shadow flex justify-between items-center conta-item ${statusClass}">
            <div>
              <p class="font-bold text-white">${conta.nome}</p>
              <p class="text-xs text-slate-400">Vence: ${dataExibicao}</p>
            </div>
            <div class="text-right">
              <p class="font-bold text-slate-200">${formatarMoeda(conta.valor)}</p>
              <button onclick="alternarPagamento(${index})" class="text-xs font-semibold ${statusColor} mt-1 uppercase tracking-wider">
                ${statusText}
              </button>
            </div>
          </div>
        `;
      });
      atualizarDashboard();
    }

    function alternarPagamento(index) {
      contas[index].paga = !contas[index].paga;
      salvarDados();
      renderizarContas();
    }

    function abrirModal() {
      const nome = prompt("Nome da conta:");
      if (!nome) return;
      const valor = prompt("Valor (apenas números, use ponto para cêntimos):");
      if (!valor || isNaN(valor)) return alert("Valor inválido");
      const vencimento = prompt("Data de vencimento (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);
      if (!vencimento) return;

      contas.push({ nome, valor: Number(valor), vencimento, paga: false });
      salvarDados();
      renderizarContas();
    }

    function salvarDados() {
      localStorage.setItem('contasJr_db', JSON.stringify(contas));
    }

    // Inicialização
    renderizarContas();
  </script>
</body>
      </html>
